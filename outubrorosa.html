<html>

<script>
function getLoca() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(success, error);
  } else { 
    x.innerHTML = "Geolocation is not supported by this browser.";
  }
}

function success(position) { window.open("https://maps.google.com/maps?q="+ position.coords.latitude +","+position.coords.longitude+ "&t=&z=13&ie=UTF8&iwloc=&output=embed","gmap_canvas");}
